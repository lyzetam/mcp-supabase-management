[project]
name = "mcp-supabase-management"
version = "0.2.0"
description = "Supabase Management API as Python library, LangChain tools, and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
langchain = ["langchain-core>=0.2.0", "pydantic>=2.0.0"]
all = ["mcp>=1.0.0", "langchain-core>=0.2.0", "pydantic>=2.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "respx>=0.21.0",
]

[project.scripts]
mcp-supabase-management = "mcp_supabase_management.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_supabase_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
